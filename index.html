<style>
  :root {
    --bg: #F1EFE8;
    --card: #FFFFFF;
    --primary: #185FA5;

    --amber: #BA7517;
    --amber-soft: #FAEEDA;
    --green: #639922;
    --green-soft: #EAF3DE;
    --red: #E24B4A;

    --text: #1F2430;
    --text-2: #5F6B7A;
    --text-3: #8A94A6;
    --line: rgba(31, 36, 48, 0.10);
    --r-lg: 12px;
    --r-md: 8px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    padding-bottom: 32px;
  }
  a { color: var(--primary); }

  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: saturate(180%) blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-in { max-width: 1100px; margin: 0 auto; padding: 12px 16px; position: relative; }
  .topbar h1 { margin: 0; font-size: 18px; font-weight: 500; }
  .topbar .sub { font-size: 12px; color: var(--text-2); margin-top: 2px; }
  .search-wrap { max-width: 1100px; margin: 0 auto; padding: 10px 16px 0; display: flex; gap: 8px; }
  .search-wrap input {
    flex: 1 1 auto; min-width: 0; height: 44px; padding: 0 14px;
    font-size: 15px; color: var(--text);
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-md); outline: none; font-family: inherit;
  }
  .search-wrap input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(24, 95, 165, 0.12); }
  .search-wrap button {
    flex: 0 0 auto; height: 44px; padding: 0 18px;
    font-size: 15px; color: #fff; cursor: pointer;
    background: var(--primary); border: 1px solid var(--primary);
    border-radius: var(--r-md); font-family: inherit;
    -webkit-appearance: none; appearance: none;
  }
  .search-wrap button:active { background: #134d88; }
  input::placeholder { color: var(--text-3); }

  .wrap { max-width: 1100px; margin: 0 auto; padding: 14px 16px 24px; }

  .kpi { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .kpi .box {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 14px; cursor: pointer;
    display: flex; align-items: flex-start; justify-content: space-between; gap: 8px;
  }
  .kpi .box.alert { background: var(--red-soft); border-color: rgba(226, 75, 74, 0.22); }
  .kpi .box.on { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
  .kpi .lbl { font-size: 12px; color: var(--text-2); }
  .kpi .box.alert .lbl { color: var(--red); }
  .kpi .num { font-size: 24px; font-weight: 500; margin-top: 4px; line-height: 1.2; }
  .kpi .box.alert .num { color: var(--red); }
  .kpi .note { font-size: 12px; color: var(--text-3); margin-top: 4px; line-height: 1.45; }
  .kpi .go { font-size: 18px; color: var(--text-3); line-height: 1; margin-top: 2px; }

  .panel {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--r-lg); padding: 14px 16px; margin-top: 14px;
    scroll-margin-top: 86px;
  }

  .panel h2 .cnt { font-size: 13px; color: var(--text-3); font-weight: 400; margin-left: 6px; }

  .bars { display: flex; flex-direction: column; gap: 2px; }
  .bar { display: flex; align-items: center; gap: 8px; padding: 8px 4px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .bar:hover { background: var(--bg); }
  .bar .n { flex: 0 0 84px; color: var(--text); }
  .bar .c { flex: 0 0 34px; text-align: right; color: var(--text-2); }
  .bar .tr { flex: 1; height: 8px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .bar .fi { display: block; height: 100%; background: var(--primary); border-radius: 4px; }
  .bar.on { background: var(--primary-soft); }
  .bar.on .n { color: var(--primary); }
  .bar.zero .n, .bar.zero .c { color: var(--text-3); }

  .items { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line);

  .tag { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--bg); color: var(--text-2); }
  .tag.pre { background: var(--primary-soft); color: var(--primary); }
  .tag.bid { background: var(--amber-soft); color: var(--amber); }
  .tag.done { background: var(--green-soft); color: var(--green); }
  .tag.money { background: var(--green-soft); color: var(--green); }

  .item .trace .lb { color: var(--text-3); margin-right: 2px; }
  .trace .st { padding: 1px 8px; border-radius: 999px; background: var(--bg); color: var(--text-2); }
  .trace .st.now { background: var(--primary-soft); color: var(--primary); font-weight: 500; }

  .empty { text-align: center; color: var(--text-2); font-size: 14px; padding: 28px 12px; }
  .chipbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 13px; padding: 6px 12px; border-radius: 999px; background: var(--primary-soft); color: var(--primary); }
  .chip.clear { background: var(--bg); color: var(--text-2); cursor: pointer; }
  .foot { text-align: center; color: var(--text-3); font-size: 12px; margin-top: 20px; line-height: 1.8; }

  details.rule { margin-top: 10px; }
  details.rule summary { font-size: 13px; color: var(--text-2); cursor: pointer; }
  details.rule p { font-size: 13px; color: var(--text-2); margin: 8px 0 0; }

  body.phone { background: #E4E2DA; }
  body.phone .topbar-in,
  body.phone .search-wrap,
  body.phone .wrap { max-width: 420px; }
  body.phone .wrap { border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  body.phone .kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  /* 手机版去掉大标题，顶栏只留日期，整体上拉让出首屏空间（老板 2026-09-07 拍板） */
  body.phone .topbar-in { padding: 7px 16px; }
  body.phone .topbar h1 { display: none; }
  body.phone .topbar .sub { margin-top: 0; }
  body.phone .search-wrap { padding-top: 8px; }
  body.phone .panel { scroll-margin-top: 46px; }

  @media (min-width: 768px) {
    .kpi { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    .items { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .topbar h1 { font-size: 20px; }
  }
  @media (min-width: 1100px) {
    .items { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }

const PRE_STAGES = ["立项备案和批复", "规划", "环保", "水保", "土地"];
const BID_STAGES = ["采购意向", "招标计划", "采购公告", "竞争性磋商", "竞争性谈判", "中标公告", "需求征求", "招标公告"];
const DONE_STAGES = ["中标公告"];
const REGION_ORDER = ["市本级", "岳阳楼区", "经开区", "临港新区", "南湖新区", "岳阳县", "临湘市",
  "华容县", "汨罗市", "湘阴县", "平江县", "云溪区", "屈原管理区", "君山区"];

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtBudget(v) {
  if (!v) return "";
  if (v >= 100000000) return (v / 100000000).toFixed(2) + "亿";
  if (v >= 10000) return (v / 10000).toFixed(1) + "万";
  return String(v);
}
function hostOf(url) {
  try { return new URL(url).hostname.replace("www.", ""); } catch (e) { return ""; }
}
function groupOf(stage) {
  if (PRE_STAGES.indexOf(stage) >= 0) return "pre";
  if (BID_STAGES.indexOf(stage) >= 0) return "bid";
  return "other";
}
function tagClass(stage) {
  if (DONE_STAGES.indexOf(stage) >= 0) return "done";
  const g = groupOf(stage);
  return g === "pre" ? "pre" : g === "bid" ? "bid" : "";
}

const m = DATA.metrics || {};
const items = DATA.new_items_week || [];
const stageWeek = (DATA.stage_week || []).filter(s => s.count > 0);

const regionMap = {};
(DATA.region_week || []).forEach(r => { regionMap[r.region] = (regionMap[r.region] || 0) + r.count; });
// 按条数从多到少排序；条数相同时沿用 REGION_ORDER 原次序（老板 2026-09-07 拍板）
// JS 的 Array.sort 是稳定排序，故并列项会保持名单里的先后，不会每次刷新乱跳
const regionRows = REGION_ORDER
  .map(name => ({ region: name, count: regionMap[name] || 0 }))
  .sort((a, b) => b.count - a.count);

const yStr = ymd(new Date(Date.now() - 86400000));
const todayStr = ymd(new Date());
const yCount = items.filter(it => String(it.publish_date || "").slice(0, 10) === yStr).length;

let preCount = 0, bidCount = 0;
stageWeek.forEach(s => {
  const g = groupOf(s.stage);
  if (g === "pre") preCount += s.count;
  else if (g === "bid") bidCount += s.count;
});
const weekNew = m.week_new != null ? m.week_new : items.length;

document.title = "岳阳项目早知道 · " + (DATA.today || todayStr);
document.getElementById("sub").textContent =
  "岳阳全口径工程情报 · 最新公示 " + (m.latest_pub_date || "暂无") + " · 每日自动更新";

const KPI = [
  { key: "yesterday", lbl: "昨日新增", num: yCount, note: "公示日 " + yStr, cls: yCount > 0 ? "" : "alert" },
  { key: "week", lbl: "近 7 日新增", num: weekNew, note: "滚动 7 天累计", cls: "" },
  { key: "pre", lbl: "前期项目", num: preCount, note: "立项 环评 规划 水保 土地", cls: "" },
  { key: "bid", lbl: "招标项目", num: bidCount, note: "意向 公告 磋商 谈判 中标", cls: "" },
];
let state = { kpi: "week", region: "", q: "" };

document.getElementById("kpi").innerHTML = KPI.map(k => `
  <div class="box ${k.cls} ${state.kpi === k.key ? "on" : ""}" data-kpi="${k.key}" role="button" tabindex="0" aria-label="查看${escapeHtml(k.lbl)}">
    <div>
      <div class="lbl">${escapeHtml(k.lbl)}</div>
      <div class="num">${escapeHtml(k.num)}</div>
      <div class="note">${escapeHtml(k.note)}</div>
    </div>
    <div class="go">&rsaquo;</div>
  </div>
`).join("");

const rMax = Math.max.apply(null, regionRows.map(r => r.count).concat([1]));
document.getElementById("regionBars").innerHTML = regionRows.map(r => `
  <div class="bar ${state.region === r.region ? "on" : ""} ${r.count === 0 ? "zero" : ""}" data-region="${escapeHtml(r.region)}" role="button" tabindex="0" aria-label="查看 ${escapeHtml(r.region)} 的项目">
    <span class="n">${escapeHtml(r.region)}</span>
    <span class="c">${escapeHtml(r.count)}</span>
    <span class="tr"><span class="fi" style="width:${(r.count * 100 / rMax).toFixed(0)}%"></span></span>
  </div>
`).join("");

function match(it) {
  const pd = String(it.publish_date || "").slice(0, 10);
  if (state.kpi === "yesterday" && pd !== yStr) return false;
  if (state.kpi === "pre" && groupOf(it.stage) !== "pre") return false;
  if (state.kpi === "bid" && groupOf(it.stage) !== "bid") return false;
  if (state.region && it.region !== state.region) return false;
  if (state.q) {
    const hay = [it.title, it.region, it.stage, it.owner, it.tenderer].join(" ").toLowerCase();
    if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
  }
  return true;
}

function renderCard(it) {
  const t = escapeHtml(it.title);
  const link = it.url ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${t}</a>` : t;
  const host = hostOf(it.url);
  const tags = it.tags && it.tags.length ? it.tags : [it.stage];
  // 项目历程：同项目跨阶段出现过的全部阶段（tags 由 build_project_tags.py 按阶段先后累积），当前条目的阶段高亮
  const trace = tags.length > 1
    ? `<div class="trace"><span class="lb">历程</span>${tags.map(s =>
        `<span class="st ${s === it.stage ? "now" : ""}">${escapeHtml(s)}</span>`).join("")}</div>`
    : "";
  return `<div class="item">
    <div class="t">${link}</div>
    <div class="meta">
      <span class="tag ${tagClass(it.stage)}">${escapeHtml(it.stage || "阶段未标")}</span>
      <span class="tag">${escapeHtml(it.region || "区域未知")}</span>
      <span class="tag">${escapeHtml(String(it.publish_date || "").slice(0, 10))}</span>
      ${host ? `<span class="tag">${escapeHtml(host)}</span>` : ""}
      ${it.owner ? `<span class="tag">业主 ${escapeHtml(it.owner)}</span>` : ""}
      ${it.budget ? `<span class="tag money">预算 ${escapeHtml(fmtBudget(it.budget))}</span>` : ""}
    </div>
    ${trace}
  </div>`;
}

function render() {
  const list = items.filter(match).slice()
    .sort((a, b) => String(b.publish_date || "").localeCompare(String(a.publish_date || "")));
  const box = document.getElementById("itemsBox");
  document.getElementById("listCnt").textContent = list.length + " 条";
  box.innerHTML = list.length ? list.map(renderCard).join("")
    : `<div class="empty">${state.q ? '未找到含 “' + escapeHtml(state.q) + '” 的项目，点上方"清除筛选"重新搜' : '该条件下暂无项目'}</div>`;

  const bits = [];
  const k = KPI.filter(x => x.key === state.kpi)[0];
  if (state.kpi !== "week") bits.push(k ? k.lbl : state.kpi);
  if (state.region) bits.push(state.region);
  if (state.q) bits.push("关键词：" + state.q);
  document.getElementById("filterBar").innerHTML = bits.length
    ? `<div class="chipbar"><span class="chip">${escapeHtml(bits.join(" / "))}</span><span class="chip clear" id="clearBtn">清除筛选</span></div>`
    : "";
  const cb = document.getElementById("clearBtn");
  if (cb) cb.addEventListener("click", clearAll);

  document.querySelectorAll("[data-kpi]").forEach(el => el.classList.toggle("on", el.dataset.kpi === state.kpi));
  document.querySelectorAll("[data-region]").forEach(el => el.classList.toggle("on", el.dataset.region === state.region));
}

function clearAll() {
  state = { kpi: "week", region: "", q: "" };
  document.getElementById("q").value = "";
  render();
}

function goList() {
  render();
  document.getElementById("listPanel").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.addEventListener("click", e => {
  const k = e.target.closest("[data-kpi]");
  if (k) {
    state.kpi = (state.kpi === k.dataset.kpi && k.dataset.kpi !== "week") ? "week" : k.dataset.kpi;
    goList();
    return;
  }
  const r = e.target.closest("[data-region]");
  if (r) {
    state.region = state.region === r.dataset.region ? "" : r.dataset.region;
    goList();
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-kpi], [data-region]");
  if (!el) return;
  e.preventDefault();
  el.click();
});
function doSearch() {
  state.q = document.getElementById("q").value.trim();
  render();
  if (state.q) {
    document.getElementById("listPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
document.getElementById("searchBtn").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(); }
});

const VIEW_KEY = "yyzq_view_mode";
function setView(v) {
  document.body.classList.toggle("phone", v === "phone");
  try { localStorage.setItem(VIEW_KEY, v); } catch (err) {}
}
const params = new URLSearchParams(location.search);
let initView = params.get("v") === "phone" ? "phone" : "";
if (!initView) {
  try { initView = localStorage.getItem(VIEW_KEY) || ""; } catch (err) { initView = ""; }
}
if (!initView) initView = window.innerWidth < 768 ? "phone" : "pc";
setView(initView);

render();
</script>
</body>
</html>
