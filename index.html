const PRE_STAGES = ["立项备案和批复", "规划", "环保", "水保", "土地"];
const BID_STAGES = ["采购意向", "招标计划", "采购公告", "竞争性磋商", "竞争性谈判", "中标公告", "需求征求", "招标公告"];
const DONE_STAGES = ["中标公告"];
const REGION_ORDER = ["市本级", "岳阳楼区", "经开区", "临港新区", "南湖新区", "岳阳县", "临湘市",
  "华容县", "汨罗市", "湘阴县", "平江县", "云溪区", "屈原管理区", "君山区"];

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]);
}
function ymd(d) {
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
}
function fmtBudget(v) {
  if (!v) return "";
  if (v >= 100000000) return (v / 100000000).toFixed(2) + "亿";
  if (v >= 10000) return (v / 10000).toFixed(1) + "万";
  return String(v);
}
function hostOf(url) {
  try { return new URL(url).hostname.replace("www.", ""); } catch (e) { return ""; }
}
function groupOf(stage) {
  if (PRE_STAGES.indexOf(stage) >= 0) return "pre";
  if (BID_STAGES.indexOf(stage) >= 0) return "bid";
  return "other";
}
function tagClass(stage) {
  if (DONE_STAGES.indexOf(stage) >= 0) return "done";
  const g = groupOf(stage);
  return g === "pre" ? "pre" : g === "bid" ? "bid" : "";
}

const m = DATA.metrics || {};
const items = DATA.new_items_week || [];
const stageWeek = (DATA.stage_week || []).filter(s => s.count > 0);

const regionMap = {};
(DATA.region_week || []).forEach(r => { regionMap[r.region] = (regionMap[r.region] || 0) + r.count; });
// 按条数从多到少排序；条数相同时沿用 REGION_ORDER 原次序（老板 2026-09-07 拍板）
// JS 的 Array.sort 是稳定排序，故并列项会保持名单里的先后，不会每次刷新乱跳
const regionRows = REGION_ORDER
  .map(name => ({ region: name, count: regionMap[name] || 0 }))
  .sort((a, b) => b.count - a.count);

const yStr = ymd(new Date(Date.now() - 86400000));
const todayStr = ymd(new Date());
const yCount = items.filter(it => String(it.publish_date || "").slice(0, 10) === yStr).length;

let preCount = 0, bidCount = 0;
stageWeek.forEach(s => {
  const g = groupOf(s.stage);
  if (g === "pre") preCount += s.count;
  else if (g === "bid") bidCount += s.count;
});
const weekNew = m.week_new != null ? m.week_new : items.length;

document.title = "岳阳项目早知道 · " + (DATA.today || todayStr);
document.getElementById("sub").textContent =
  "岳阳全口径工程情报 · 最新公示 " + (m.latest_pub_date || "暂无") + " · 每日自动更新";

const KPI = [
  { key: "yesterday", lbl: "昨日新增", num: yCount, note: "公示日 " + yStr, cls: yCount > 0 ? "" : "alert" },
  { key: "week", lbl: "近 7 日新增", num: weekNew, note: "滚动 7 天累计", cls: "" },
  { key: "pre", lbl: "前期项目", num: preCount, note: "立项 环评 规划 水保 土地", cls: "" },
  { key: "bid", lbl: "招标项目", num: bidCount, note: "意向 公告 磋商 谈判 中标", cls: "" },
];
let state = { kpi: "week", region: "", q: "" };

document.getElementById("kpi").innerHTML = KPI.map(k => `
  <div class="box ${k.cls} ${state.kpi === k.key ? "on" : ""}" data-kpi="${k.key}" role="button" tabindex="0" aria-label="查看${escapeHtml(k.lbl)}">
    <div>
      <div class="lbl">${escapeHtml(k.lbl)}</div>
      <div class="num">${escapeHtml(k.num)}</div>
      <div class="note">${escapeHtml(k.note)}</div>
    </div>
    <div class="go">&rsaquo;</div>
  </div>
`).join("");

const rMax = Math.max.apply(null, regionRows.map(r => r.count).concat([1]));
document.getElementById("regionBars").innerHTML = regionRows.map(r => `
  <div class="bar ${state.region === r.region ? "on" : ""} ${r.count === 0 ? "zero" : ""}" data-region="${escapeHtml(r.region)}" role="button" tabindex="0" aria-label="查看 ${escapeHtml(r.region)} 的项目">
    <span class="n">${escapeHtml(r.region)}</span>
    <span class="c">${escapeHtml(r.count)}</span>
    <span class="tr"><span class="fi" style="width:${(r.count * 100 / rMax).toFixed(0)}%"></span></span>
  </div>
`).join("");

function match(it) {
  const pd = String(it.publish_date || "").slice(0, 10);
  if (state.kpi === "yesterday" && pd !== yStr) return false;
  if (state.kpi === "pre" && groupOf(it.stage) !== "pre") return false;
  if (state.kpi === "bid" && groupOf(it.stage) !== "bid") return false;
  if (state.region && it.region !== state.region) return false;
  if (state.q) {
    const hay = [it.title, it.region, it.stage, it.owner, it.tenderer].join(" ").toLowerCase();
    if (hay.indexOf(state.q.toLowerCase()) < 0) return false;
  }
  return true;
}

function renderCard(it) {
  const t = escapeHtml(it.title);
  const link = it.url ? `<a href="${escapeHtml(it.url)}" target="_blank" rel="noopener">${t}</a>` : t;
  const host = hostOf(it.url);
  const tags = it.tags && it.tags.length ? it.tags : [it.stage];
  // 项目历程：同项目跨阶段出现过的全部阶段（tags 由 build_project_tags.py 按阶段先后累积），当前条目的阶段高亮
  const trace = tags.length > 1
    ? `<div class="trace"><span class="lb">历程</span>${tags.map(s =>
        `<span class="st ${s === it.stage ? "now" : ""}">${escapeHtml(s)}</span>`).join("")}</div>`
    : "";
  return `<div class="item">
    <div class="t">${link}</div>
    <div class="meta">
      <span class="tag ${tagClass(it.stage)}">${escapeHtml(it.stage || "阶段未标")}</span>
      <span class="tag">${escapeHtml(it.region || "区域未知")}</span>
      <span class="tag">${escapeHtml(String(it.publish_date || "").slice(0, 10))}</span>
      ${host ? `<span class="tag">${escapeHtml(host)}</span>` : ""}
      ${it.owner ? `<span class="tag">业主 ${escapeHtml(it.owner)}</span>` : ""}
      ${it.budget ? `<span class="tag money">预算 ${escapeHtml(fmtBudget(it.budget))}</span>` : ""}
    </div>
    ${trace}
  </div>`;
}

function render() {
  const list = items.filter(match).slice()
    .sort((a, b) => String(b.publish_date || "").localeCompare(String(a.publish_date || "")));
  const box = document.getElementById("itemsBox");
  document.getElementById("listCnt").textContent = list.length + " 条";
  box.innerHTML = list.length ? list.map(renderCard).join("")
    : `<div class="empty">${state.q ? '未找到含 “' + escapeHtml(state.q) + '” 的项目，点上方"清除筛选"重新搜' : '该条件下暂无项目'}</div>`;

  const bits = [];
  const k = KPI.filter(x => x.key === state.kpi)[0];
  if (state.kpi !== "week") bits.push(k ? k.lbl : state.kpi);
  if (state.region) bits.push(state.region);
  if (state.q) bits.push("关键词：" + state.q);
  document.getElementById("filterBar").innerHTML = bits.length
    ? `<div class="chipbar"><span class="chip">${escapeHtml(bits.join(" / "))}</span><span class="chip clear" id="clearBtn">清除筛选</span></div>`
    : "";
  const cb = document.getElementById("clearBtn");
  if (cb) cb.addEventListener("click", clearAll);

  document.querySelectorAll("[data-kpi]").forEach(el => el.classList.toggle("on", el.dataset.kpi === state.kpi));
  document.querySelectorAll("[data-region]").forEach(el => el.classList.toggle("on", el.dataset.region === state.region));
}

function clearAll() {
  state = { kpi: "week", region: "", q: "" };
  document.getElementById("q").value = "";
  render();
}

function goList() {
  render();
  document.getElementById("listPanel").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.addEventListener("click", e => {
  const k = e.target.closest("[data-kpi]");
  if (k) {
    state.kpi = (state.kpi === k.dataset.kpi && k.dataset.kpi !== "week") ? "week" : k.dataset.kpi;
    goList();
    return;
  }
  const r = e.target.closest("[data-region]");
  if (r) {
    state.region = state.region === r.dataset.region ? "" : r.dataset.region;
    goList();
  }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const el = e.target.closest("[data-kpi], [data-region]");
  if (!el) return;
  e.preventDefault();
  el.click();
});
function doSearch() {
  state.q = document.getElementById("q").value.trim();
  render();
  if (state.q) {
    document.getElementById("listPanel").scrollIntoView({ behavior: "smooth", block: "start" });
  }
}
document.getElementById("searchBtn").addEventListener("click", doSearch);
document.getElementById("q").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); doSearch(); }
});

const VIEW_KEY = "yyzq_view_mode";
function setView(v) {
  document.body.classList.toggle("phone", v === "phone");
  try { localStorage.setItem(VIEW_KEY, v); } catch (err) {}
}
const params = new URLSearchParams(location.search);
let initView = params.get("v") === "phone" ? "phone" : "";
if (!initView) {
  try { initView = localStorage.getItem(VIEW_KEY) || ""; } catch (err) { initView = ""; }
}
if (!initView) initView = window.innerWidth < 768 ? "phone" : "pc";
setView(initView);

render();
</script>
</body>
</html>
